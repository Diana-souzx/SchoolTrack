<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem Vindo(a)!</title>
    <link rel="stylesheet" href="./configuração/reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="superior">Bem Vindo(a) ao</h1>
    <img id="logo-school" src="./img/logo-versão-azul.png" alt="">
    <h1 id="inferior">Mobilidade inteligente na palma da sua mão!</h1>
    
    <button  onclick="entrar()" class="log-user" id="entrar">Entrar</button>
    <button onclick="cadastrar()" class="log-user" id="cadastrar-se">Cadastrar-se</button>

    <div id="onibus-icon">
    </div>
</body>
<script>
    function entrar() {
        const onibus = document.getElementById('onibus-icon');
        onibus.classList.add('animar');

        setTimeout(() => {
            window.location.href = './html/login.html'; 
        }, 2000);
    }
    function cadastrar() {
        const onibus = document.getElementById('onibus-icon');
        onibus.classList.add('animar');

        setTimeout(() => {
            window.location.href = './html/cadastro.html'; 
        }, 2000);
    }


</script>
</html>
