<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
    <link rel="stylesheet" href="../configuração/reset.css">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <form id="formulario" action="../php/cadastro.php" method="post">
        <div id="conteiner-cad">
            <div id="superior-cont">
                <img id="icon-onibus" src="../img/icon-onibus-logo.png" alt="">
                <h1>Cadastrar-se</h1>
            </div><br>

        <div id="cadastro-duplo">

        <div class="part-one">
            <label for="nome">Seu nome:</label>
            <input id="nome" type="text" name="nome" required><br>

            <label for="senha">Sua senha:</label>
            <input type="password" name="senha" id="senha" required maxlength="10" minlength="5" placeholder="12345..."><br>

            <label for="email">Seu e-mail:</label>
            <input type="email" name="email" id="email"><br>

            <label for="repetir-senha">Repita a senha:</label>
            <input type="password" name="senha2" id="senha2" required maxlength="10" minlength="5" placeholder="12345...">
        </div>

        <div class="part-two">
            <label for="bairro">Seu bairro:</label>
            <select name="bairro" id="bairro" required>
            <option value="">Selecione...</option>
            </select><br>

            <label for="telefone">Seu telefone:</label>
            <input type="text" name="telefone" id="telefone" pattern="\d{10,11}" maxlength="11" minlength="11" required><br>

            <label for="notificações">Você deseja receber notificações?</label>
            <div id="primeira-escolha">
                <label for="escolha-um" id="sim">Sim</label>
                <input type="radio" name="notificacao" class="radios" value="sim">
            </div>
            <div id="segunda-escolha">
                <label for="escolha-dois" id="não">Não</label>
                <input type="radio" name="notificacao" class="radios" value="nao">
            </div><br>
        

            <input onclick="cadastro(event)" id="cadastre" type="submit" value="Cadastrar-se">
            
        </div></div>
    </form><div id="onibus-icon">
            </div>
</body>
<script>
    document.addEventListener("DOMContentLoaded", function () {
    fetch("../php/bairros.php")
        .then(response => response.json())
        .then(data => {
            const select = document.getElementById("bairro");
            data.forEach(bairro => {
                const option = document.createElement("option");
                option.value = bairro.id_bairro;
                option.textContent = bairro.nome_bairro;
                select.appendChild(option);
            });
        })
        .catch(error => {
            console.error("Erro ao carregar bairros:", error);
        });
    });
</script>
</html>
